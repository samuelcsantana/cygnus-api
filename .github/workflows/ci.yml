name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 24 to match the Dockerfile's base image — CI should typecheck against
      # the same runtime the deployed image runs, not a different LTS.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This repo has no `postinstall` hook, so the Prisma client isn't
      # generated by `npm ci` — and without it `tsc` fails on every
      # repository that imports a model type.
      - name: Generate Prisma client
        run: npm run prisma:generate

      # `build` is plain `tsc`, so this doubles as the typecheck — there is no
      # separate `typecheck` script to run. No lint step yet either: the repo
      # has no ESLint setup, and adding one belongs in its own change.
      - name: Build
        run: npm run build
