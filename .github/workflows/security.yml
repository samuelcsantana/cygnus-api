name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # New advisories can land for dependencies already pinned in the lockfile,
    # with no code change of ours to trigger push/PR — catch those weekly too.
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # high/critical is the actionable threshold, matching the other repos in
      # this portfolio: moderate-and-below is dominated by transitive build
      # tooling with no non-breaking upgrade path.
      #
      # This passes only because of the `deepmerge-ts` override in
      # package.json — docs/dependency-overrides.md explains why npm and a
      # Prisma upgrade both fail to resolve it. Drop the override once
      # @prisma/config depends on 8.x itself; this job is what will tell you
      # if that was premature.
      #
      # No secretlint job here, unlike vertex-web: this repo has neither a
      # husky pre-commit hook nor a .secretlintrc, and a scanner with no
      # configuration would be theatre rather than a check.
      - name: Audit dependencies
        run: npm audit --audit-level=high
