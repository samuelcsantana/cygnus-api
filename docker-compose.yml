name: cygnus-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: cygnus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - cygnus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cygnus-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - cygnus_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cygnus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # This compose file runs the production image locally over plain HTTP (no TLS terminator),
      # so auth cookies must not be marked Secure or the browser silently refuses to store them.
      SECURE_COOKIES: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '${PORT}:${PORT}'
    volumes:
      # WORKDIR /app in the Dockerfile — matches `UPLOADS_DIR` in
      # src/shared/config/uploads.ts, which resolves to `/app/uploads` when running the built
      # `dist/main.js` from that working directory. Persists milestone photos across container
      # recreations.
      - cygnus_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cygnus_postgres_data:
    name: cygnus_postgres_data
  cygnus_redis_data:
    name: cygnus_redis_data
  cygnus_uploads_data:
    name: cygnus_uploads_data
