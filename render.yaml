# Render Blueprint. Apply from the dashboard (New > Blueprint) against this
# repository; Render reads this file and creates everything below in one go.
#
# Docs: https://render.com/docs/blueprint-spec
#
# Everything here is on the free tier. Two consequences worth knowing before
# this carries anything real:
#   - a free Postgres instance is deleted after 30 days;
#   - a free web service sleeps after inactivity, so the first request after
#     idling pays a cold start, and the BullMQ worker in this same process is
#     asleep along with it — the 08:00 reminder sweep will not fire reliably
#     until this moves to a paid instance.
services:
  - name: cygnus-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # The Dockerfile's CMD runs `prisma migrate deploy` before starting the
    # server, so schema changes land on deploy without a separate release step.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the port the Dockerfile EXPOSEs and the app binds to.
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      # The frontend's origin, exactly — @fastify/cors takes a single origin
      # and credentials: true, so a wildcard would be rejected by the browser
      # for credentialed requests anyway.
      #
      # This shares an eTLD+1 with the API's own domain
      # (api.cygnus.samuelsantana.dev) on purpose: the auth cookies are
      # SameSite=Strict, so a frontend on a different registrable domain — a
      # *.vercel.app URL, for instance — would never have them sent back, and
      # every request after login would 401. Changing this value to a
      # different site silently breaks authentication.
      - key: CORS_ORIGIN
        value: https://cygnus.samuelsantana.dev
      - key: DATABASE_URL
        fromDatabase:
          name: cygnus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cygnus-keyvalue
          property: connectionString
      # Generated by Render, so they never exist in this repository or in
      # anyone's shell history. Rotating them is a dashboard action.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # sync: false means Render prompts for these on first apply and never
      # reads them from this file. Leave RESEND_API_KEY empty to have
      # EmailService no-op with a warning instead of throwing.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - name: cygnus-keyvalue
    type: keyvalue
    plan: free
    # Reachable only from services inside this Render account. BullMQ and the
    # vaccine-catalog cache are the only clients; nothing needs public access.
    ipAllowList: []

databases:
  - name: cygnus-postgres
    plan: free
