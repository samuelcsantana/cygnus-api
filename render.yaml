# Render Blueprint. Apply from the dashboard (New > Blueprint) against this
# repository; Render reads this file and creates everything below in one go.
#
# Docs: https://render.com/docs/blueprint-spec
#
# Postgres is NOT declared here: the database is Neon, managed outside Render.
# Render's own free Postgres is deleted after 30 days, which is a poor home for
# the only copy of anyone's vaccination records. DATABASE_URL is therefore a
# prompted secret rather than a `fromDatabase` reference — see below.
#
# The rest is on Render's free tier, with one consequence worth knowing: a free
# web service sleeps when idle, and the BullMQ worker runs in this same
# process, so it sleeps too. The 08:00 reminder sweep will not fire dependably
# until this is a paid instance.
services:
  - name: cygnus-api
    type: web
    runtime: docker
    # Same region as the Neon project (aws-us-east-2). Render defaults to
    # Oregon, and the database is in Ohio: leaving it unset puts every query
    # on a cross-continent round trip. A service region cannot be changed
    # after creation, only recreated, so it belongs here and not in a fix.
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    # The Dockerfile's CMD runs `prisma migrate deploy` before starting the
    # server, so schema changes land on deploy without a separate release step.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the port the Dockerfile EXPOSEs and the app binds to.
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      # The frontend's origin, exactly — @fastify/cors takes a single origin
      # and credentials: true, so a wildcard would be rejected by the browser
      # for credentialed requests anyway.
      #
      # This shares an eTLD+1 with the API's own domain
      # (api.cygnus.samuelsantana.dev) on purpose: the auth cookies are
      # SameSite=Strict, so a frontend on a different registrable domain — a
      # *.vercel.app URL, for instance — would never have them sent back, and
      # every request after login would 401. Changing this value to a
      # different site silently breaks authentication.
      - key: CORS_ORIGIN
        value: https://cygnus.samuelsantana.dev
      # Neon, not a Render database. Use Neon's **pooled** connection string
      # (the host with `-pooler` in it) with `sslmode=require`: this service
      # holds a long-lived pool of its own, and the free Neon tier caps direct
      # connections low enough that a redeploy overlapping the old instance can
      # exhaust them.
      #
      # `prisma migrate deploy` runs on container start and does not go through
      # the pooler well — if migrations fail with a prepared-statement error,
      # that is why; run them against the direct (non-pooled) host instead.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cygnus-keyvalue
          property: connectionString
      # Generated by Render, so they never exist in this repository or in
      # anyone's shell history. Rotating them is a dashboard action.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # sync: false means Render prompts for these on first apply and never
      # reads them from this file. Leave RESEND_API_KEY empty to have
      # EmailService no-op with a warning instead of throwing.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - name: cygnus-keyvalue
    type: keyvalue
    # Must match the web service above: Render private networking only
    # reaches services in the same region, and this instance is not
    # publicly exposed.
    region: ohio
    plan: free
    # BullMQ requires `noeviction`. Render's default for a Key Value instance is
    # `allkeys_lru`, which under memory pressure evicts *any* key — job hashes and
    # the dead letter list included. That would make the retry/backoff/DLQ work in
    # docs/queue-reliability.md conditional on Redis not being busy: a dead letter
    # that can be evicted is not a dead letter. With noeviction, a full instance
    # rejects new writes with an error the producer can see instead.
    maxmemoryPolicy: noeviction
    # Reachable only from services inside this Render account. BullMQ and the
    # vaccine-catalog cache are the only clients; nothing needs public access.
    ipAllowList: []

